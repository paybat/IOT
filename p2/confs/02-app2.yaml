apiVersion: v1
kind: ConfigMap
metadata:
  name: app2-content
data:
  index.html: |
    <!doctype html><html><head><title>app2</title></head><body><h1>app2</h1><p>Three replicas serve this application.</p></body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
spec:
  replicas: 3
  selector:
    matchLabels: { app: app2 }
  template:
    metadata:
      labels: { app: app2 }
    spec:
      containers:
        - name: nginx
          image: nginx:1.30.5-alpine3.24
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: http }
          volumeMounts:
            - { name: content, mountPath: /usr/share/nginx/html, readOnly: true }
      volumes:
        - name: content
          configMap: { name: app2-content }
---
apiVersion: v1
kind: Service
metadata:
  name: app2
spec:
  selector: { app: app2 }
  ports:
    - { name: http, port: 80, targetPort: http }
