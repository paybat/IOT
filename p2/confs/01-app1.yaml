apiVersion: v1
kind: ConfigMap
metadata:
  name: app1-content
data:
  index.html: | 
    <!doctype html><html><head><title>app1</title></head><body><h1>app1</h1><p>Served by the app1 workload.</p></body></html>
---
apiVersion: apps/v1 
kind: Deployment
metadata:
  name: app1
spec: 
  replicas: 1
  selector:
    matchLabels: { app: app1 }
  template:
    metadata:
      labels: { app: app1 }
    spec:
      containers:
        - name: nginx
          image: nginx:1.30.5-alpine3.24
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: http }
          volumeMounts:
            - { name: content, mountPath: /usr/share/nginx/html, readOnly: true }
      volumes:
        - name: content
          configMap: { name: app1-content }
---
apiVersion: v1 
kind: Service
metadata:
  name: app1
spec:
  selector: { app: app1 }
  ports:
    - { name: http, port: 80, targetPort: http }