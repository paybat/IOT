apiVersion: v1
kind: ConfigMap
metadata:
  name: app3-content
data:
  index.html: |
    <!doctype html><html><head><title>app3</title></head><body><h1>app3</h1><p>Default application when no host rule matches.</p></body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3
spec:
  replicas: 1
  selector:
    matchLabels: { app: app3 }
  template:
    metadata:
      labels: { app: app3 }
    spec:
      containers:
        - name: nginx
          image: nginx:1.31.7-alpine3.24
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: http }
          volumeMounts:
            - { name: content, mountPath: /usr/share/nginx/html, readOnly: true }
      volumes:
        - name: content
          configMap: { name: app3-content }
---
apiVersion: v1
kind: Service
metadata:
  name: app3
spec:
  selector: { app: app3 }
  ports:
    - { name: http, port: 80, targetPort: http }
